name: PR Docs Start

on:
  # zizmor: ignore[dangerous-triggers] target-context workflow only creates a PR preview comment and never checks out code
  pull_request_target:
    types: [opened]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: create
        uses: actions-cool/maintain-one-comment-backup@17f644ff1665b05890083f7c1091fef135bce5e4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            <img width="400" src="https://user-images.githubusercontent.com/17680888/145667098-5fc781c7-4c6d-463a-af06-133e9195c01b.png">
            <!-- ELEMENT_PLUS_PREVIEW -->
          body-include: '<!-- ELEMENT_PLUS_PREVIEW -->'
