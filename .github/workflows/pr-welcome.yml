name: PR Welcome
# Note that this `pull_request_target` is vulnerable, it grants write access to a fork repo
# DO NOT ADD ANY CHECKOUT/CACHING in this workflow
on:
  # zizmor: ignore[dangerous-triggers] target-context workflow only assigns reviewers and labels PRs without checking out code
  pull_request_target:
    types: [opened]

jobs:
  pr-open-greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions-cool/check-user-permission@c21884f3dda18dafc2f8b402fe807ccc9ec1aa5e # v2.4.0
        id: isTeamMember
        with:
          require: 'write'
          username: ${{ github.event.pull_request.user.login }}

      - uses: actions-awesome/pr-helper@48f7641b8b2feebab7d6a2fbc22812fd0bfee829 # 1.1.1
        if: steps.isTeamMember.outputs.require-result == 'false'
        with:
          actions: 'add-assignees, add-reviewers, add-labels'
          assignees: 'element-plus/backers'
          reviewers: 'element-plus/backers'
          labels: 'Contribution::Community'
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
