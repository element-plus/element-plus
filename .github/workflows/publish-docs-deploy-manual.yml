name: Publish Docs Deploy (Manual)

on: workflow_dispatch

jobs:
  deploy-docs:
    concurrency:
      group: docs-i18n-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Init Crowdin token
        run: pnpm run docs:crowdin-credentials
        env:
          CROWDIN_TOKEN: ${{secrets.CROWDIN_TOKEN}}

      - name: Pull Crowdin translations
        run: cd docs && pnpm exec crowdin download -l zh-CN && pnpm exec crowdin download -l es-ES

      - name: Generate common locale
        run: pnpm docs:gen-locale

      - name: Install latest Element Plus
        run: cd docs && pnpm i element-plus@latest

      - name: Get Latest Release Version
        id: get_release
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/element-plus/element-plus/releases/latest | jq -r '.tag_name')
          echo "latest_version=${LATEST_VERSION}" >> $GITHUB_OUTPUT

      - name: Sync translations to docs-i18n
        env:
          RELEASE_VERSION: ${{ steps.get_release.outputs.latest_version }}
          EP_BOT_TOKEN: ${{ secrets.EP_BOT_TOKEN }}
        run: |
          set -euo pipefail

          TARGET_REPO="$(mktemp -d)"

          git clone \
            --depth=1 \
            "https://x-access-token:${EP_BOT_TOKEN}@github.com/element-plus/docs-i18n.git" \
            "$TARGET_REPO"

          COMMIT_MESSAGE="docs-i18n: sync translations for ${RELEASE_VERSION}" \
            bash scripts/sync-docs-i18n.sh "$GITHUB_WORKSPACE/docs" "$TARGET_REPO" --push

      - name: Build Metadata
        run: cd internal/metadata && pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build website
        run: pnpm docs:build
        env:
          DOC_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/.vitepress/dist
          git-config-name: ElementPlusBot
          git-config-email: element-plus@outlook.com
          commit-message: website deploy ${{ steps.get_release.outputs.latest_version }}

      - name: Deploy to Vercel
        env:
          RELEASE_VERSION: ${{ steps.get_release.outputs.latest_version }}
        run: |
          set -euo pipefail

          REPO_DIR="$(mktemp -d)"

          git clone \
            --depth=1 \
            https://x-access-token:${{ secrets.EP_BOT_TOKEN }}@github.com/element-plus/vercel-publish.git \
            "$REPO_DIR"

          rsync -a \
            --delete \
            --exclude .git \
            --exclude CNAME \
            docs/.vitepress/dist/ \
            "$REPO_DIR/"

          cd "$REPO_DIR"

          git config user.name "ElementPlusBot"
          git config user.email "element-plus@outlook.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "website deploy ${RELEASE_VERSION}"

          git push origin main --force-with-lease

      - name: Deploy to Vercel Main
        env:
          RELEASE_VERSION: ${{ steps.get_release.outputs.latest_version }}
        run: |
          set -euo pipefail

          REPO_DIR="$(mktemp -d)"

          git clone \
            --depth=1 \
            https://x-access-token:${{ secrets.EP_BOT_TOKEN }}@github.com/element-plus/vercel-publish-main.git \
            "$REPO_DIR"

          rsync -a \
            --delete \
            --exclude .git \
            --exclude CNAME \
            docs/.vitepress/dist/ \
            "$REPO_DIR/"

          cd "$REPO_DIR"

          git config user.name "ElementPlusBot"
          git config user.email "element-plus@outlook.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "website deploy ${RELEASE_VERSION}"

          git push origin main --force-with-lease
