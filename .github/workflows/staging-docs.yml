name: Staging Docs

on:
  push:
    branches:
      - 'dev'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'element-plus' }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Get version
        run: echo "TAG_VERSION=0.0.0-staging.${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Get git head
        run: echo "GIT_HEAD=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Set last version
        run: pnpm update:version && pnpm gen:version
        env:
          TAG_VERSION: ${{env.TAG_VERSION}}
          GIT_HEAD: ${{env.GIT_HEAD}}

      - name: Compile Element Plus
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Init Crowdin token
        run: pnpm run docs:crowdin-credentials
        env:
          CROWDIN_TOKEN: ${{secrets.CROWDIN_TOKEN}}

      - name: Upload source files
        run: cd docs && pnpm exec crowdin upload sources

      - name: Pull Crowdin translations
        run: cd docs && pnpm exec crowdin download -l zh-CN && pnpm exec crowdin download -l es-ES

      - name: Generate common locale
        run: pnpm docs:gen-locale

      - name: Build Metadata
        run: cd internal/metadata && pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build website
        run: pnpm docs:build
        env:
          DOC_ENV: staging
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Deploy staging website
        run: |
          set -euo pipefail

          REPO_DIR="$(mktemp -d)"

          git clone \
            --depth=1 \
            https://x-access-token:${{ secrets.EP_BOT_TOKEN }}@github.com/element-plus/staging.git \
            "$REPO_DIR"

          rsync -a \
            --delete \
            --exclude .git \
            --exclude CNAME \
            docs/.vitepress/dist/ \
            "$REPO_DIR/"

          cd "$REPO_DIR"

          git config user.name "ElementPlusBot"
          git config user.email "element-plus@outlook.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "website deploy ${TAG_VERSION}"

          git push origin main --force-with-lease
